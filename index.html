<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Fractal Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #888;
        }

        #app {
            width: 100%;
            height: 100%;
        }

        #app canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .loading, .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: monospace;
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .error {
            color: #f44;
        }

        #info-container {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 40ch;
            max-height: calc(100vh - 20px);
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 4px;
        }

        #info {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="info-container">
        Scroll to zoom, drag to pan
        <details>
            <summary>Debug</summary>
            <pre id="info"></pre>
        </details>
    </div>
    <script type="module" src="./dist/app.js"></script>
</body>
</html>
